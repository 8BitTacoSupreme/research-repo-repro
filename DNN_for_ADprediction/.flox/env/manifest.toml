## Flox Environment Manifest — Pure Nix (no pip, no Docker)
## Reproduces the environment from Park et al. (2020)
## "Prediction of Alzheimer's Disease Based on Deep Neural Network
##  by Integrating Gene Expression and DNA Methylation Dataset"
##
## Architecture:
##   .flox/pkgs/python-ml-env.nix — Python 3.6.9 + TF 1.4.1 + ML stack
##   .flox/pkgs/r-bio-env.nix     — R 3.6.1 + limma + CRAN packages
##   Both import a pinned nixpkgs (nixos-19.09, commit 75f4ba05c63).
##   Every artifact is hash-pinned in the Nix store. Zero pip at runtime.
##
## Usage:
##   1. flox build              # one-time: builds Python + R from Nix expressions
##   2. flox activate           # activates env with Python, R, and system tools
##
## Target: x86_64-linux only (TF 1.4.1 wheel is manylinux1 x86_64)
## For k8s: `flox containerize` exports an OCI image — no Docker needed.

# Flox manifest version managed by Flox CLI
version = 1

[install]
# System tools from current Flox catalog
coreutils.pkg-path = "coreutils"
bash.pkg-path = "bash"
curl.pkg-path = "curl"
gzip.pkg-path = "gzip"
gnused.pkg-path = "gnused"

[hook]
on-activate = """
  # Wire up Nix-built Python and R environments from .flox/pkgs/
  # These are produced by `flox build` (hash-pinned, no pip).
  _project_root="${FLOX_ENV%%/.flox/*}"

  _missing=""
  for _pkg in python-ml-env r-bio-env; do
    _result="$_project_root/result-$_pkg"
    if [ -L "$_result" ]; then
      export PATH="$(readlink -f "$_result")/bin:$PATH"
    else
      _missing="$_missing $_pkg"
    fi
  done

  if [ -n "$_missing" ]; then
    echo ""
    echo "WARNING: Build results not found for:$_missing"
    echo "Run 'flox build' first to build the Python and R environments."
    echo ""
  fi
"""

[profile]
common = """
  echo "=== Park et al. (2020) DNN for AD Prediction ==="
  echo "Pure Nix environment — no pip, no Docker"
  if command -v python3 >/dev/null 2>&1; then
    echo "Python: $(python3 --version 2>&1)"
  fi
  if command -v R >/dev/null 2>&1; then
    echo "R: $(R --version 2>&1 | head -1)"
  fi
  echo ""
  echo "Pipeline steps:"
  echo "  1. cd 'code/01 data preprocessing' && python3 Split_Inputdata.py"
  echo "  2. cd 'code/02 feature selection'   && Rscript '01 investigate_DEG_DMP.R'"
  echo "  3. cd 'code/02 feature selection'   && python3 '02 Annotate_DMP.py'"
  echo "  4. cd 'code/04 prediction'          && python3 AD_Prediction_ML.py"
  echo "  5. cd 'code/04 prediction'          && python3 AD_Prediction_DNN.py"
"""

[containerize]
  [containerize.config]
  working-dir = "/workspace"

[options]
## TF 1.4.1 requires x86_64 (no arm64 wheels).
## On Apple Silicon: `flox containerize` -> run OCI image on x86_64-linux.
systems = ["x86_64-linux"]
