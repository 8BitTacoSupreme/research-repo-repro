## Flox Environment Manifest
## Reproduces the environment from Park et al. (2020)
## "Prediction of Alzheimer's Disease Based on Deep Neural Network
##  by Integrating Gene Expression and DNA Methylation Dataset"
##
## Target: x86_64-linux (TF 1.4.1 requires x86_64; no arm64 wheels)
## Strategy: Nix provides system-level deps; pip installs Python ML stack
##           in a venv via the on-activate hook.

# Flox manifest version managed by Flox CLI
version = 1

[install]
python3.pkg-path = "python36"
R.pkg-path = "R"
gcc.pkg-path = "gcc"
pkg-config.pkg-path = "pkg-config"
zlib.pkg-path = "zlib"
curl.pkg-path = "curl"
gnumake.pkg-path = "gnumake"
coreutils.pkg-path = "coreutils"
bash.pkg-path = "bash"
gzip.pkg-path = "gzip"
gawk.pkg-path = "gawk"

[vars]
TF_VERSION = "1.4.1"
NUMPY_VERSION = "1.16.3"
PANDAS_VERSION = "0.24.2"
SKLEARN_VERSION = "0.21.0"
BAYESOPT_VERSION = "1.0.1"
MATPLOTLIB_VERSION = "3.0.3"
SCIPY_VERSION = "1.2.1"

[hook]
on-activate = """
  # --- Python virtual environment with pinned ML packages ---
  if [ ! -d "$FLOX_ENV_CACHE/venv" ]; then
    echo "==> Creating Python 3.6 virtual environment..."
    python3 -m venv "$FLOX_ENV_CACHE/venv"
    . "$FLOX_ENV_CACHE/venv/bin/activate"
    pip install --upgrade "pip==19.3.1" "setuptools==44.1.1" "wheel==0.33.6"
    echo "==> Installing pinned Python packages..."
    pip install \
      "numpy==$NUMPY_VERSION" \
      "scipy==$SCIPY_VERSION" \
      "pandas==$PANDAS_VERSION" \
      "scikit-learn==$SKLEARN_VERSION" \
      "matplotlib==$MATPLOTLIB_VERSION" \
      "bayesian-optimization==$BAYESOPT_VERSION" \
      "tensorflow==$TF_VERSION"
  else
    . "$FLOX_ENV_CACHE/venv/bin/activate"
  fi

  # --- R packages (CRAN + Bioconductor limma) ---
  if [ ! -f "$FLOX_ENV_CACHE/.r_packages_installed" ]; then
    echo "==> Installing R packages (CRAN + Bioconductor)..."
    R_LIB_DIR="$FLOX_ENV_CACHE/R_libs"
    mkdir -p "$R_LIB_DIR"
    Rscript -e "
      lib_dir <- Sys.getenv('FLOX_ENV_CACHE')
      lib_dir <- paste0(lib_dir, '/R_libs')
      .libPaths(c(lib_dir, .libPaths()))
      install.packages(
        c('openxlsx', 'data.table', 'ggplot2', 'pracma', 'dgof'),
        repos = 'https://cloud.r-project.org',
        lib = lib_dir
      )
      if (!requireNamespace('BiocManager', quietly = TRUE))
        install.packages('BiocManager', repos = 'https://cloud.r-project.org', lib = lib_dir)
      library(BiocManager, lib.loc = lib_dir)
      BiocManager::install(version = '3.9', ask = FALSE)
      BiocManager::install('limma', lib = lib_dir, update = FALSE, ask = FALSE)
    "
    touch "$FLOX_ENV_CACHE/.r_packages_installed"
    echo "==> R packages installed."
  fi
  export R_LIBS_USER="$FLOX_ENV_CACHE/R_libs"
"""

[profile]
common = """
  echo "Park et al. (2020) DNN for AD Prediction - Reproducibility Environment"
  echo "Python: $(python3 --version 2>&1)"
  echo "R: $(R --version 2>&1 | head -1)"
  echo ""
  echo "Pipeline steps (run from code/ subdirectories):"
  echo "  1. cd 'code/01 data preprocessing' && python Split_Inputdata.py"
  echo "  2. cd 'code/02 feature selection'   && Rscript '01 investigate_DEG_DMP.R'"
  echo "  3. cd 'code/02 feature selection'   && python '02 Annotate_DMP.py'"
  echo "  4. cd 'code/04 prediction'          && python AD_Prediction_ML.py"
  echo "  5. cd 'code/04 prediction'          && python AD_Prediction_DNN.py"
"""

[containerize]
  [containerize.config]
  working-dir = "/workspace"

[options]
## Note: On Apple Silicon (aarch64-darwin), use the Dockerfile instead of flox activate.
## TF 1.4.1 requires x86_64 (no arm64 wheels, AVX incompatible with Rosetta 2).
## Build:  docker build --platform linux/amd64 -t park2020-ad-dnn .
## Run:    docker run --platform linux/amd64 -v $(pwd):/workspace -w /workspace -it park2020-ad-dnn bash
systems = ["x86_64-linux"]
