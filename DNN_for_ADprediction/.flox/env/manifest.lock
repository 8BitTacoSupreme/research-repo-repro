      }
    },
    "vars": {
      "BAYESOPT_VERSION": "1.0.1",
      "MATPLOTLIB_VERSION": "3.0.3",
      "NUMPY_VERSION": "1.16.3",
      "PANDAS_VERSION": "0.24.2",
      "SCIPY_VERSION": "1.2.1",
      "SKLEARN_VERSION": "0.21.0",
      "TF_VERSION": "1.4.1"
    },
    "hook": {
      "on-activate": "  # --- Python virtual environment with pinned ML packages ---\n  if [ ! -d \"$FLOX_ENV_CACHE/venv\" ]; then\n    echo \"==> Creating Python 3.6 virtual environment...\"\n    python3 -m venv \"$FLOX_ENV_CACHE/venv\"\n    . \"$FLOX_ENV_CACHE/venv/bin/activate\"\n    pip install --upgrade \"pip==19.3.1\" \"setuptools==44.1.1\" \"wheel==0.33.6\"\n    echo \"==> Installing pinned Python packages...\"\n    pip install \"numpy==$NUMPY_VERSION\" \"scipy==$SCIPY_VERSION\" \"pandas==$PANDAS_VERSION\" \"scikit-learn==$SKLEARN_VERSION\" \"matplotlib==$MATPLOTLIB_VERSION\" \"bayesian-optimization==$BAYESOPT_VERSION\" \"tensorflow==$TF_VERSION\"\n  else\n    . \"$FLOX_ENV_CACHE/venv/bin/activate\"\n  fi\n\n  # --- R packages (CRAN + Bioconductor limma) ---\n  if [ ! -f \"$FLOX_ENV_CACHE/.r_packages_installed\" ]; then\n    echo \"==> Installing R packages (CRAN + Bioconductor)...\"\n    R_LIB_DIR=\"$FLOX_ENV_CACHE/R_libs\"\n    mkdir -p \"$R_LIB_DIR\"\n    Rscript -e \"\n      lib_dir <- Sys.getenv('FLOX_ENV_CACHE')\n      lib_dir <- paste0(lib_dir, '/R_libs')\n      .libPaths(c(lib_dir, .libPaths()))\n      install.packages(\n        c('openxlsx', 'data.table', 'ggplot2', 'pracma', 'dgof'),\n        repos = 'https://cloud.r-project.org',\n        lib = lib_dir\n      )\n      if (!requireNamespace('BiocManager', quietly = TRUE))\n        install.packages('BiocManager', repos = 'https://cloud.r-project.org', lib = lib_dir)\n      library(BiocManager, lib.loc = lib_dir)\n      BiocManager::install(version = '3.9', ask = FALSE)\n      BiocManager::install('limma', lib = lib_dir, update = FALSE, ask = FALSE)\n    \"\n    touch \"$FLOX_ENV_CACHE/.r_packages_installed\"\n    echo \"==> R packages installed.\"\n  fi\n  export R_LIBS_USER=\"$FLOX_ENV_CACHE/R_libs\"\n"
    },
    "profile": {
      "common": "  echo \"Park et al. (2020) DNN for AD Prediction - Reproducibility Environment\"\n  echo \"Python: $(python3 --version 2>&1)\"\n  echo \"R: $(R --version 2>&1 | head -1)\"\n  echo \"\"\n  echo \"Pipeline steps (run from code/ subdirectories):\"\n  echo \"  1. cd 'code/01 data preprocessing' && python Split_Inputdata.py\"\n  echo \"  2. cd 'code/02 feature selection'   && Rscript '01 investigate_DEG_DMP.R'\"\n  echo \"  3. cd 'code/02 feature selection'   && python '02 Annotate_DMP.py'\"\n  echo \"  4. cd 'code/04 prediction'          && python AD_Prediction_ML.py\"\n  echo \"  5. cd 'code/04 prediction'          && python AD_Prediction_DNN.py\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-linux"
      ]
    },
    "containerize": {
      "config": {
        "working-dir": "/workspace"
      }
    }
  },
