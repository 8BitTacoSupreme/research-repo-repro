    "hook": {
      "on-activate": "  # Wire up Nix-built Python and R environments from .flox/pkgs/\n  # These are produced by `flox build` (hash-pinned, no pip).\n  _project_root=\"${FLOX_ENV%%/.flox/*}\"\n\n  _missing=\"\"\n  for _pkg in python-ml-env r-bio-env; do\n    _result=\"$_project_root/result-$_pkg\"\n    if [ -L \"$_result\" ]; then\n      export PATH=\"$(readlink -f \"$_result\")/bin:$PATH\"\n    else\n      _missing=\"$_missing $_pkg\"\n    fi\n  done\n\n  if [ -n \"$_missing\" ]; then\n    echo \"\"\n    echo \"WARNING: Build results not found for:$_missing\"\n    echo \"Run 'flox build' first to build the Python and R environments.\"\n    echo \"\"\n  fi\n"
    },
    "profile": {
      "common": "  echo \"=== Park et al. (2020) DNN for AD Prediction ===\"\n  echo \"Pure Nix environment — no pip, no Docker\"\n  if command -v python3 >/dev/null 2>&1; then\n    echo \"Python: $(python3 --version 2>&1)\"\n  fi\n  if command -v R >/dev/null 2>&1; then\n    echo \"R: $(R --version 2>&1 | head -1)\"\n  fi\n  echo \"\"\n  echo \"Pipeline steps:\"\n  echo \"  1. cd 'code/01 data preprocessing' && python3 Split_Inputdata.py\"\n  echo \"  2. cd 'code/02 feature selection'   && Rscript '01 investigate_DEG_DMP.R'\"\n  echo \"  3. cd 'code/02 feature selection'   && python3 '02 Annotate_DMP.py'\"\n  echo \"  4. cd 'code/04 prediction'          && python3 AD_Prediction_ML.py\"\n  echo \"  5. cd 'code/04 prediction'          && python3 AD_Prediction_DNN.py\"\n"
    },
    "options": {
      "systems": [
        "x86_64-linux"
      ]
    },
    "containerize": {
      "config": {
        "working-dir": "/workspace"
      }
    }
  },
